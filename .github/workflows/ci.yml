name: CI

on:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Run tests
        run: npm test

  test-large:
    name: Large dataset test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 本機約 7–14 秒；CI runner 較慢，只抓明顯退化，精細比較在本機用 A/B
      SSOT_LARGE_MAX_MS: 40000
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run large tests
        run: npm run test:large

      - name: Run large UI smoke test
        run: |
          npm run gen:large
          SMOKE_INPUT=samples/large-1000.txt node tests/ui-smoke.js
