name: CI

on:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 依改動範圍分流：只改文件、skill、agent 定義時只跑文件測試；改到程式才跑全套；
  # 改到核心、範例、工具或測試才跑大型資料測試。排程與手動執行一律全跑。
  changes:
    name: Detect changed scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
      large: ${{ steps.scope.outputs.large }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "large=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE" "$HEAD")
          printf '%s\n' "$files"
          # 只算文件：Markdown、.claude/（agent、skill、hook 設定）、.github/skills/
          code=false; large=false
          if printf '%s\n' "$files" | grep -Ev '\.md$|^\.claude/|^\.github/skills/' | grep -q .; then code=true; fi
          if printf '%s\n' "$files" | grep -Eq '^(src|samples|tools|tests|profiles)/|^index\.html$|^package(-lock)?\.json$|^\.github/workflows/'; then large=true; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"; echo "large=$large" >> "$GITHUB_OUTPUT"

  docs:
    name: Docs check
    needs: changes
    if: needs.changes.outputs.code != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run docs tests
        run: npm run test:docs

      - name: Check whitespace and conflict markers
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

  test:
    name: Test (Node ${{ matrix.node }})
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'schedule' && needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Run tests
        run: npm test

      # 整個 tree 對空 tree 比較：行尾空白、衝突標記等；RouterOS 原始輸出與 vendor 由 .gitattributes 排除
      - name: Check whitespace and conflict markers
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

  test-large:
    name: Large dataset test
    needs: changes
    if: needs.changes.outputs.large == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 本機約 7–14 秒；CI runner 較慢，只抓明顯退化，精細比較在本機用 A/B
      SSOT_LARGE_MAX_MS: 40000
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run large tests
        run: npm run test:large

      - name: Run large UI smoke test
        run: |
          npm run gen:large
          SMOKE_INPUT=samples/large-1000.txt node tests/ui-smoke.js
