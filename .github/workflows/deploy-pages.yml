name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Test site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy site
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      # 只發布畫面需要的檔案；tests、docs、tools、.claude 等不上站
      - name: Assemble site
        run: |
          mkdir _site
          git ls-files -z index.html assets src profiles samples vendor | xargs -0 cp --parents -t _site
          engine=$(sed -nE "s/.*ENGINE_SRC = '([^']+)'.*/\1/p" src/view/graph/elk-layout.js)
          [ -n "$engine" ] || { echo "::error::找不到 elk-layout.js 的 ENGINE_SRC"; exit 1; }
          missing=0
          for f in $(grep -oE '(src|href)="[^"#:]+"' index.html | sed -E 's/^(src|href)="//;s/"$//') "$engine"; do
            [ -f "_site/$f" ] || { echo "::error::網站缺少 $f"; missing=1; }
          done
          exit $missing

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
